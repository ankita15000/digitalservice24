<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB5j4Bb8M_ADXx1vORWM9V445zrkNHUTGk",
  authDomain: "digital-service-24.firebaseapp.com",
  projectId: "digital-service-24",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.login = async function () {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  await signInWithEmailAndPassword(auth, email, password);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  loadData();
};

async function loadData() {
  const querySnapshot = await getDocs(collection(db, "inquiries"));
  let html = "";

  querySnapshot.forEach((docSnap) => {
    const d = docSnap.data();

    html += `
    <div class="card">
      <h3>${d.name}</h3>
      <p>${d.phone}</p>
      <p>${d.message}</p>
      <span>${d.type}</span>
      <button onclick="updateStatus('${docSnap.id}')">Mark Done</button>
    </div>`;
  });

  document.getElementById("cards").innerHTML = html;
}

window.updateStatus = async function (id) {
  const ref = doc(db, "inquiries", id);
  await updateDoc(ref, { status: "Completed" });
  loadData();
};
</script>

<style>
body{
  font-family:Poppins;
  background:#0f172a;
  color:#fff;
}

.login{
  max-width:300px;
  margin:100px auto;
}

input,button{
  width:100%;
  padding:12px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}

button{
  background:#2563eb;
  color:#fff;
  cursor:pointer;
}

.dashboard{
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
}
</style>

</head>

<body>

<div id="loginBox" class="login">
<h2>Admin Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" class="dashboard" style="display:none;">
<h2>Dashboard</h2>
<div class="cards" id="cards"></div>
</div>

</body>
</html>
